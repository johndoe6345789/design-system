# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (shared/components/m3)
        working-directory: shared/components/m3
        run: npm install
      - name: Install (shared/components)
        working-directory: shared/components
        run: npm install
      - name: lint (shared/components)
        working-directory: shared/components
        run: npm run lint
      - name: typecheck (shared/components)
        working-directory: shared/components
        run: npm run typecheck
      - name: build (shared/components)
        working-directory: shared/components
        run: npm run build
      - name: Install (shared/e2e)
        working-directory: shared/e2e
        run: npm install
      - name: Install (shared/hooks/email)
